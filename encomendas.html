<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encomendas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111; --surface: #1C1C1C; --card: #242424; --card-hover: #2A2A2A;
  --border: #333; --accent: #F97316; --accent-dim: rgba(249,115,22,0.15);
  --green: #22C55E; --green-dim: rgba(34,197,94,0.12);
  --red: #EF4444; --red-dim: rgba(239,68,68,0.12);
  --yellow: #EAB308;
  --text: #E5E5E5; --text-muted: #888; --text-dim: #555;
  --radius: 10px; --radius-sm: 6px;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

/* ── HEADER ── */
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 14px; height: 52px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.header-stats { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); }
.header-stats span strong { color: var(--text); font-weight: 600; margin-left: 3px; }

/* ── TOOLBAR ── */
.toolbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 8px 14px; display: flex; gap: 8px; align-items: center;
  position: sticky; top: 52px; z-index: 99;
}
.btn-nova {
  background: var(--accent); color: white; border: none; border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
  padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 5px;
  white-space: nowrap; flex-shrink: 0;
}
.search-wrap { position: relative; flex: 1; }
.search-wrap input {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px;
  padding: 7px 10px 7px 30px; outline: none; width: 100%;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 12px; }
.btn-pdf-top {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  padding: 7px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.btn-pdf-top:hover { border-color: var(--accent); color: var(--accent); }

/* ── FILTER BAR ── */
.filterbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 14px; display: flex; gap: 0;
}
.filter-btn {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  padding: 8px 14px; cursor: pointer; transition: all 0.15s;
}
.filter-btn.ativo { color: var(--accent); border-bottom-color: var(--accent); }

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }

/* ── DATA GROUP ── */
.data-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.data-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
.data-line { flex: 1; height: 1px; background: var(--border); }
.data-count { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

/* ── CLIENTE GROUP ── */
.cliente-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
.cliente-header { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
.cliente-info { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cliente-avatar { width: 28px; height: 28px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
.cliente-nome { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cliente-tel { font-size: 11px; color: var(--text-muted); }
.btn-wpp { display: flex; align-items: center; gap: 4px; background: #128C7E22; border: 1px solid #128C7E55; border-radius: var(--radius-sm); color: #25D366; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; padding: 5px 8px; cursor: pointer; text-decoration: none; flex-shrink: 0; }
.btn-wpp svg { width: 12px; height: 12px; }

/* ── ENCOMENDA CARD ── */
.encomenda-card { padding: 10px 12px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; }
.encomenda-card:last-child { border-bottom: none; }
.encomenda-card.pago { border-left-color: var(--green); }
.encomenda-card.pendente { border-left-color: var(--yellow); }
.enc-num { font-size: 10px; font-weight: 700; color: var(--text-dim); padding-top: 2px; }
.enc-peca { font-size: 13px; font-weight: 600; line-height: 1.3; }
.enc-codigos { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
.enc-cod-tag { font-size: 10px; background: rgba(249,115,22,0.08); border: 1px solid rgba(249,115,22,0.2); border-radius: 4px; padding: 1px 6px; color: var(--accent); font-weight: 600; }
.enc-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.enc-fornecedor { font-size: 11px; color: var(--text-muted); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
.enc-preco { font-size: 13px; font-weight: 700; color: var(--accent); }
.enc-hora { font-size: 10px; color: var(--text-dim); }
.enc-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.badge-status { font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer; border: none; font-family: 'Inter', sans-serif; white-space: nowrap; }
.badge-status.pago { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.badge-status.pendente { background: rgba(234,179,8,0.1); color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
.enc-btns { display: flex; gap: 4px; }
.btn-icon { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 3px 5px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
.btn-icon:hover { color: var(--accent); background: var(--accent-dim); }
.btn-icon.del:hover { color: var(--red); background: var(--red-dim); }

/* ── EMPTY ── */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 36px; opacity: 0.3; }

/* ── DRAWER (formulário) ── */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; display: none; }
.drawer-overlay.open { display: block; }
.drawer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 0 16px 24px;
  max-height: 92vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
}
.drawer.open { transform: translateY(0); }
.drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 10px auto 14px; }
.drawer-title { font-size: 14px; font-weight: 800; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.form-group label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
  padding: 10px 12px; outline: none; width: 100%;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group input::placeholder { color: var(--text-dim); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.toggle-pago { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; user-select: none; }
.toggle-pago input { display: none; }
.toggle-track { width: 36px; height: 20px; background: var(--border); border-radius: 999px; position: relative; transition: background 0.2s; flex-shrink: 0; }
.toggle-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: transform 0.2s; }
.toggle-pago.ativo .toggle-track { background: var(--green); }
.toggle-pago.ativo .toggle-track::after { transform: translateX(16px); }
.toggle-label { font-size: 14px; font-weight: 500; }
.btn-cadastrar {
  background: var(--accent); color: white; border: none; border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
  padding: 13px; cursor: pointer; width: 100%; margin-top: 4px;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-cadastrar:hover { opacity: 0.9; }
.btn-cadastrar:active { transform: scale(0.98); }

/* ── MODAL GENÉRICO ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 400; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
.modal-title { font-size: 14px; font-weight: 700; }
.modal-btns { display: flex; gap: 8px; margin-top: 4px; }
.btn-cancel { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 10px; cursor: pointer; }
.btn-ok { flex: 1; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; padding: 10px; cursor: pointer; }
.periodo-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.periodo-btn { flex: 1; min-width: 80px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; padding: 8px 4px; cursor: pointer; text-align: center; }
.periodo-btn.ativo { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.custom-dates { display: flex; gap: 8px; }
.custom-dates .form-group { flex: 1; }
.preview-info { font-size: 12px; color: var(--text-muted); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 16px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 999; opacity: 0; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.verde { border-left: 3px solid var(--green); }
.toast.laranja { border-left: 3px solid var(--accent); }
.toast.vermelha { border-left: 3px solid var(--red); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

/* ══ PRINT / PDF ══════════════════════════════════════════════════════ */
@media print {
  @page { size: A4; margin: 16mm 12mm; }
  body { background: white !important; color: #111 !important; }
  header, .toolbar, .filterbar, .drawer, .drawer-overlay, .toast,
  .modal-overlay, .enc-actions, .btn-wpp { display: none !important; }
  .main { padding: 0 !important; overflow: visible !important; gap: 12px !important; }
  .pdf-header { display: flex !important; }
  .pdf-summary { display: flex !important; }
  .pdf-footer { display: block !important; }
  .cliente-group { border: 1px solid #ccc !important; background: white !important; break-inside: avoid; }
  .cliente-header { background: #f5f5f5 !important; border-bottom: 1px solid #ddd !important; }
  .cliente-nome, .enc-peca { color: #111 !important; }
  .cliente-tel, .enc-fornecedor { color: #555 !important; }
  .enc-fornecedor { background: #f0f0f0 !important; border-color: #ccc !important; }
  .cliente-avatar { background: #eee !important; border-color: #bbb !important; color: #333 !important; }
  .encomenda-card { border-bottom: 1px solid #eee !important; }
  .encomenda-card.pago { border-left-color: #16a34a !important; }
  .encomenda-card.pendente { border-left-color: #ca8a04 !important; }
  .enc-preco { color: #ea580c !important; }
  .enc-cod-tag { color: #ea580c !important; background: #fff7ed !important; border-color: #fed7aa !important; }
  .enc-hora, .enc-num, .data-count { color: #777 !important; }
  .data-label { color: #ea580c !important; }
  .data-line { background: #ccc !important; }
  .badge-status.pago { background: #dcfce7 !important; color: #16a34a !important; border-color: #86efac !important; }
  .badge-status.pendente { background: #fef9c3 !important; color: #854d0e !important; border-color: #fde047 !important; }
  .data-group { break-inside: avoid; }
}
.pdf-header { display: none; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #ea580c; }
.pdf-title { font-size: 17px; font-weight: 800; color: #111; }
.pdf-subtitle { font-size: 11px; color: #555; margin-top: 3px; }
.pdf-summary { display: none; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; gap: 20px; flex-wrap: wrap; }
.pdf-summary-item { display: flex; flex-direction: column; gap: 2px; }
.pdf-summary-item span:first-child { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
.pdf-summary-item strong { font-size: 13px; font-weight: 700; }
.pdf-footer { display: none; text-align: right; font-size: 10px; color: #888; margin-top: 16px; padding-top: 8px; border-top: 1px solid #ddd; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">📦</div>
    Encomendas
  </div>
  <div class="header-stats">
    <span>Total:<strong id="stat-total">0</strong></span>
    <span style="color:var(--text-muted)">Pend:<strong id="stat-pend" style="color:var(--yellow)">0</strong></span>
    <span>Pagos:<strong id="stat-pag" style="color:var(--green)">0</strong></span>
    <span>R$<strong id="stat-val" style="color:var(--accent)">0</strong></span>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="btn-nova" onclick="abrirDrawer()">＋ Nova</button>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="inp-busca" placeholder="Buscar cliente, peça, código..." oninput="renderizar()">
  </div>
  <button class="btn-pdf-top" onclick="abrirModalPDF()">🖨️ PDF</button>
</div>

<!-- FILTER BAR -->
<div class="filterbar">
  <button class="filter-btn ativo" data-filter="todos" onclick="setFilter('todos')">Todos</button>
  <button class="filter-btn" data-filter="pendente" onclick="setFilter('pendente')">Pendentes</button>
  <button class="filter-btn" data-filter="pago" onclick="setFilter('pago')">Pagos</button>
</div>

<!-- MAIN -->
<main class="main" id="main-content">
  <div class="pdf-header" id="pdf-header">
    <div>
      <div class="pdf-title">📦 Relatório de Encomendas</div>
      <div class="pdf-subtitle" id="pdf-subtitle"></div>
    </div>
    <div style="font-size:10px;color:#555;text-align:right" id="pdf-date-info"></div>
  </div>
  <div class="pdf-summary" id="pdf-summary">
    <div class="pdf-summary-item"><span>Total</span><strong id="ps-total">0</strong></div>
    <div class="pdf-summary-item"><span>Pagas</span><strong id="ps-pag" style="color:#16a34a">0</strong></div>
    <div class="pdf-summary-item"><span>Pendentes</span><strong id="ps-pend" style="color:#854d0e">0</strong></div>
    <div class="pdf-summary-item"><span>Valor total</span><strong id="ps-val" style="color:#ea580c">R$ 0,00</strong></div>
  </div>
  <div id="lista-encomendas"></div>
  <div class="pdf-footer" id="pdf-footer"></div>
</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ══ DRAWER — NOVA ENCOMENDA ══ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="fecharDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">Nova Encomenda</div>

  <div class="form-group">
    <label>Cliente *</label>
    <input type="text" id="inp-cliente" placeholder="Nome do cliente" autocomplete="off">
  </div>
  <div class="form-group">
    <label>Telefone</label>
    <input type="tel" id="inp-tel" placeholder="(00) 00000-0000" maxlength="16">
  </div>
  <div class="form-group">
    <label>Peça *</label>
    <input type="text" id="inp-peca" placeholder="Descrição da peça">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Cód. Peça</label>
      <input type="text" id="inp-cod-peca" placeholder="Ex: 30088">
    </div>
    <div class="form-group">
      <label>Cód. Fornecedor</label>
      <input type="text" id="inp-cod-forn" placeholder="Ex: NK-8821">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Fornecedor</label>
      <input type="text" id="inp-fornecedor" placeholder="Ex: Nakata">
    </div>
    <div class="form-group">
      <label>Preço (R$)</label>
      <input type="number" id="inp-preco" placeholder="0,00" min="0" step="0.01">
    </div>
  </div>
  <div class="form-group">
    <label>Pagamento</label>
    <label class="toggle-pago" id="toggle-pago">
      <input type="checkbox" id="chk-pago">
      <span class="toggle-track"></span>
      <span class="toggle-label" id="toggle-label">Pendente</span>
    </label>
  </div>
  <button class="btn-cadastrar" onclick="cadastrar()">✓ Cadastrar Encomenda</button>
</div>

<!-- ══ MODAL EDITAR ══ -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <div class="modal-title">✏️ Editar Encomenda</div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Peça</label>
      <input type="text" id="edit-peca">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Cód. Peça</label>
        <input type="text" id="edit-cod-peca">
      </div>
      <div class="form-group">
        <label>Cód. Fornecedor</label>
        <input type="text" id="edit-cod-forn">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fornecedor</label>
        <input type="text" id="edit-fornecedor">
      </div>
      <div class="form-group">
        <label>Preço (R$)</label>
        <input type="number" id="edit-preco" min="0" step="0.01">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal('modal-editar')">Cancelar</button>
      <button class="btn-ok" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>

<!-- ══ MODAL PDF ══ -->
<div class="modal-overlay" id="modal-pdf">
  <div class="modal" style="max-width:440px">
    <div class="modal-title">🖨️ Gerar PDF</div>
    <div class="form-group">
      <label>Fornecedor</label>
      <select id="pdf-fornecedor"><option value="">Todos os fornecedores</option></select>
    </div>
    <div class="form-group">
      <label>Período</label>
      <div class="periodo-btns">
        <button class="periodo-btn ativo" data-p="hoje" onclick="setPeriodo('hoje')">Hoje</button>
        <button class="periodo-btn" data-p="semana" onclick="setPeriodo('semana')">Esta semana</button>
        <button class="periodo-btn" data-p="mes" onclick="setPeriodo('mes')">Este mês</button>
        <button class="periodo-btn" data-p="custom" onclick="setPeriodo('custom')">Personalizado</button>
      </div>
    </div>
    <div class="custom-dates" id="custom-dates" style="display:none">
      <div class="form-group"><label>De</label><input type="date" id="pdf-data-ini"></div>
      <div class="form-group"><label>Até</label><input type="date" id="pdf-data-fim"></div>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="pdf-status">
        <option value="">Todos</option>
        <option value="pago">Somente pagos</option>
        <option value="pendente">Somente pendentes</option>
      </select>
    </div>
    <div class="preview-info" id="pdf-preview-info">—</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal('modal-pdf')">Cancelar</button>
      <button class="btn-ok" onclick="gerarPDF()">Imprimir / PDF</button>
    </div>
  </div>
</div>

<script>
// ── DADOS ────────────────────────────────────────────────────────────────────
let encomendas = JSON.parse(localStorage.getItem('encomendas_v3') || '[]');
let filtroAtivo = 'todos';
let periodoAtivo = 'hoje';

// ── DRAWER ───────────────────────────────────────────────────────────────────
function abrirDrawer() {
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  setTimeout(() => document.getElementById('inp-cliente').focus(), 350);
}
function fecharDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// ── TOGGLE PAGO ──────────────────────────────────────────────────────────────
document.getElementById('toggle-pago').addEventListener('click', function(e) {
  e.preventDefault();
  const chk = document.getElementById('chk-pago');
  chk.checked = !chk.checked;
  this.classList.toggle('ativo', chk.checked);
  document.getElementById('toggle-label').textContent = chk.checked ? 'Pago' : 'Pendente';
});

// ── MÁSCARA TELEFONE ─────────────────────────────────────────────────────────
document.getElementById('inp-tel').addEventListener('input', function() {
  let v = this.value.replace(/\D/g,'').substring(0,11);
  if (v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else if (v.length > 0) v = `(${v}`;
  this.value = v;
});

// ── CADASTRAR ─────────────────────────────────────────────────────────────────
function cadastrar() {
  const cliente    = document.getElementById('inp-cliente').value.trim();
  const tel        = document.getElementById('inp-tel').value.trim();
  const peca       = document.getElementById('inp-peca').value.trim();
  const codPeca    = document.getElementById('inp-cod-peca').value.trim();
  const codForn    = document.getElementById('inp-cod-forn').value.trim();
  const fornecedor = document.getElementById('inp-fornecedor').value.trim();
  const preco      = parseFloat(document.getElementById('inp-preco').value) || 0;
  const pago       = document.getElementById('chk-pago').checked;

  if (!cliente || !peca) { toast('Preencha nome do cliente e peça.', 'vermelha', '⚠️'); return; }

  const agora = new Date();
  encomendas.unshift({
    id: Date.now().toString(), cliente, tel, peca, codPeca, codForn,
    fornecedor, preco, pago,
    data: agora.toLocaleDateString('pt-BR'),
    dataISO: agora.toISOString().slice(0,10),
    hora: agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
  });

  salvar();
  renderizar();
  limparForm();
  fecharDrawer();   // ← FECHA o formulário após cadastrar
  toast(`✅ Encomenda de ${cliente} cadastrada!`, 'verde');
}

function limparForm() {
  ['inp-cliente','inp-tel','inp-peca','inp-cod-peca','inp-cod-forn','inp-fornecedor','inp-preco']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('chk-pago').checked = false;
  document.getElementById('toggle-pago').classList.remove('ativo');
  document.getElementById('toggle-label').textContent = 'Pendente';
}

function salvar() { localStorage.setItem('encomendas_v3', JSON.stringify(encomendas)); }

// ── FILTRO ────────────────────────────────────────────────────────────────────
function setFilter(f) {
  filtroAtivo = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('ativo', b.dataset.filter === f));
  renderizar();
}

// ── STATUS ────────────────────────────────────────────────────────────────────
function togglePago(id) {
  const enc = encomendas.find(e => e.id === id); if (!enc) return;
  enc.pago = !enc.pago;
  salvar(); renderizar();
  toast(enc.pago ? '✅ Marcada como paga!' : '🕐 Pendente novamente', enc.pago ? 'verde' : 'laranja');
}

// ── EXCLUIR ───────────────────────────────────────────────────────────────────
function excluir(id) {
  if (!confirm('Excluir esta encomenda?')) return;
  encomendas = encomendas.filter(e => e.id !== id);
  salvar(); renderizar();
  toast('🗑️ Encomenda excluída.', 'vermelha');
}

// ── EDITAR ────────────────────────────────────────────────────────────────────
function abrirEditar(id) {
  const enc = encomendas.find(e => e.id === id); if (!enc) return;
  document.getElementById('edit-id').value       = id;
  document.getElementById('edit-peca').value     = enc.peca;
  document.getElementById('edit-cod-peca').value = enc.codPeca || '';
  document.getElementById('edit-cod-forn').value = enc.codForn || '';
  document.getElementById('edit-fornecedor').value = enc.fornecedor || '';
  document.getElementById('edit-preco').value    = enc.preco;
  document.getElementById('modal-editar').classList.add('open');
}
function salvarEdicao() {
  const id = document.getElementById('edit-id').value;
  const enc = encomendas.find(e => e.id === id); if (!enc) return;
  enc.peca       = document.getElementById('edit-peca').value.trim() || enc.peca;
  enc.codPeca    = document.getElementById('edit-cod-peca').value.trim();
  enc.codForn    = document.getElementById('edit-cod-forn').value.trim();
  enc.fornecedor = document.getElementById('edit-fornecedor').value.trim();
  enc.preco      = parseFloat(document.getElementById('edit-preco').value) || 0;
  salvar(); renderizar(); fecharModal('modal-editar');
  toast('✏️ Encomenda atualizada!', 'laranja');
}

function fecharModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m =>
  m.addEventListener('click', function(e) { if (e.target === this) fecharModal(this.id); })
);

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function wppLink(tel, nome) {
  const num = tel.replace(/\D/g,'');
  const msg = encodeURIComponent(`Olá ${nome}, tudo bem? Passando para avisar sobre sua encomenda.`);
  return `https://wa.me/55${num}?text=${msg}`;
}

// ── RENDER CARDS ──────────────────────────────────────────────────────────────
function buildCards(lista) {
  if (!lista.length) return `<div class="empty"><div class="empty-icon">📦</div><p>Nenhuma encomenda encontrada.</p></div>`;

  const porData = {};
  lista.forEach(e => {
    const k = e.dataISO || '0000-00-00';
    if (!porData[k]) porData[k] = {};
    if (!porData[k][e.cliente]) porData[k][e.cliente] = [];
    porData[k][e.cliente].push(e);
  });

  let html = '';
  Object.keys(porData).sort((a,b)=>b.localeCompare(a)).forEach(dataISO => {
    const grupos = porData[dataISO];
    const total = Object.values(grupos).flat().length;
    const dFmt = dataISO !== '0000-00-00'
      ? (() => { const d = new Date(dataISO+'T12:00:00'); const s = d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); })()
      : 'Data não registrada';

    html += `<div class="data-group">
      <div class="data-header">
        <span class="data-label">${dFmt}</span>
        <span class="data-line"></span>
        <span class="data-count">${total} encomenda${total>1?'s':''}</span>
      </div>`;

    Object.entries(grupos).forEach(([nome, items]) => {
      const tel = items[0].tel;
      const ini = nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
      const temTel = tel && tel.replace(/\D/g,'').length >= 10;

      html += `<div class="cliente-group">
        <div class="cliente-header">
          <div class="cliente-info">
            <div class="cliente-avatar">${ini}</div>
            <div>
              <div class="cliente-nome">${nome}</div>
              <div class="cliente-tel">${tel||'Sem telefone'} · ${items.length} item${items.length>1?'s':''}</div>
            </div>
          </div>
          ${temTel?`<a class="btn-wpp" href="${wppLink(tel,nome)}" target="_blank">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.855L.057 23.886c-.06.217.002.45.163.606.116.112.27.171.427.171.059 0 .119-.008.178-.025l6.248-1.638A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.897 0-3.688-.506-5.237-1.389l-.374-.22-3.875 1.016 1.005-3.762-.243-.386A9.936 9.936 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
            WhatsApp</a>`:''}
        </div>
        ${items.map((e,i) => {
          const codigos = [e.codPeca ? `Peça: ${e.codPeca}` : '', e.codForn ? `Forn: ${e.codForn}` : ''].filter(Boolean);
          return `<div class="encomenda-card ${e.pago?'pago':'pendente'}">
            <div class="enc-num">#${i+1}</div>
            <div class="enc-body">
              <div class="enc-peca">${e.peca}</div>
              ${codigos.length?`<div class="enc-codigos">${codigos.map(c=>`<span class="enc-cod-tag">${c}</span>`).join('')}</div>`:''}
              <div class="enc-meta">
                ${e.fornecedor?`<span class="enc-fornecedor">${e.fornecedor}</span>`:''}
                ${e.preco>0?`<span class="enc-preco">R$ ${e.preco.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:''}
                <span class="enc-hora">${e.hora||''}</span>
              </div>
            </div>
            <div class="enc-actions">
              <button class="badge-status ${e.pago?'pago':'pendente'}" onclick="togglePago('${e.id}')">${e.pago?'✓ Pago':'⏳ Pendente'}</button>
              <div class="enc-btns">
                <button class="btn-icon" onclick="abrirEditar('${e.id}')" title="Editar">✏️</button>
                <button class="btn-icon del" onclick="excluir('${e.id}')" title="Excluir">🗑</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ── RENDERIZAR ────────────────────────────────────────────────────────────────
function renderizar() {
  const busca = document.getElementById('inp-busca').value.toLowerCase();
  const lista = encomendas.filter(e => {
    const mf = filtroAtivo==='todos' || (filtroAtivo==='pago'&&e.pago) || (filtroAtivo==='pendente'&&!e.pago);
    const mb = !busca || e.cliente.toLowerCase().includes(busca)
      || e.peca.toLowerCase().includes(busca)
      || (e.fornecedor||'').toLowerCase().includes(busca)
      || (e.codPeca||'').toLowerCase().includes(busca)
      || (e.codForn||'').toLowerCase().includes(busca);
    return mf && mb;
  });

  const tot = encomendas.length, pgs = encomendas.filter(e=>e.pago).length;
  const val = encomendas.reduce((s,e)=>s+e.preco,0);
  document.getElementById('stat-total').textContent = tot;
  document.getElementById('stat-pag').textContent   = pgs;
  document.getElementById('stat-pend').textContent  = tot-pgs;
  document.getElementById('stat-val').textContent   = val.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  document.getElementById('lista-encomendas').innerHTML = buildCards(lista);
}

// ── PDF ───────────────────────────────────────────────────────────────────────
function abrirModalPDF() {
  const fns = [...new Set(encomendas.map(e=>e.fornecedor).filter(Boolean))].sort();
  const sel = document.getElementById('pdf-fornecedor');
  sel.innerHTML = '<option value="">Todos os fornecedores</option>';
  fns.forEach(f => { const o = document.createElement('option'); o.value=f; o.textContent=f; sel.appendChild(o); });
  setPeriodo('hoje');
  atualizarPreview();
  document.getElementById('modal-pdf').classList.add('open');
  ['pdf-fornecedor','pdf-status','pdf-data-ini','pdf-data-fim'].forEach(id =>
    document.getElementById(id).addEventListener('change', atualizarPreview)
  );
}

function setPeriodo(p) {
  periodoAtivo = p;
  document.querySelectorAll('.periodo-btn').forEach(b => b.classList.toggle('ativo', b.dataset.p===p));
  document.getElementById('custom-dates').style.display = p==='custom' ? 'flex' : 'none';
  if (p !== 'custom') atualizarPreview();
}

function getIntervalo() {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const iso = d => d.toISOString().slice(0,10);
  if (periodoAtivo==='hoje') return { ini: iso(hoje), fim: iso(hoje) };
  if (periodoAtivo==='semana') {
    const dom = new Date(hoje); dom.setDate(hoje.getDate()-hoje.getDay());
    const sab = new Date(dom); sab.setDate(dom.getDate()+6);
    return { ini: iso(dom), fim: iso(sab) };
  }
  if (periodoAtivo==='mes') {
    return { ini: iso(new Date(hoje.getFullYear(),hoje.getMonth(),1)), fim: iso(new Date(hoje.getFullYear(),hoje.getMonth()+1,0)) };
  }
  return { ini: document.getElementById('pdf-data-ini').value, fim: document.getElementById('pdf-data-fim').value };
}

function filtrarPDF() {
  const forn   = document.getElementById('pdf-fornecedor').value;
  const status = document.getElementById('pdf-status').value;
  const {ini,fim} = getIntervalo();
  return encomendas.filter(e => {
    const d = e.dataISO||'';
    return (!ini||d>=ini) && (!fim||d<=fim)
      && (!forn||e.fornecedor===forn)
      && (!status||(status==='pago'?e.pago:!e.pago));
  });
}

function atualizarPreview() {
  const lista = filtrarPDF();
  const val = lista.reduce((s,e)=>s+e.preco,0);
  const pgs = lista.filter(e=>e.pago).length;
  const forn = document.getElementById('pdf-fornecedor').value || 'Todos';
  document.getElementById('pdf-preview-info').innerHTML =
    `<strong>${lista.length}</strong> encomenda${lista.length!==1?'s':''} · Fornecedor: <strong>${forn}</strong> · R$ <strong>${val.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong> · Pagas: <strong>${pgs}</strong> · Pendentes: <strong>${lista.length-pgs}</strong>`;
}

function gerarPDF() {
  const lista = filtrarPDF();
  if (!lista.length) { toast('Nenhuma encomenda nesse filtro.', 'vermelha'); return; }
  const {ini,fim} = getIntervalo();
  const forn   = document.getElementById('pdf-fornecedor').value || 'Todos os fornecedores';
  const fmtD   = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '';
  const pLabels = {hoje:`Hoje — ${fmtD(ini)}`, semana:`Semana: ${fmtD(ini)} a ${fmtD(fim)}`, mes:`Mês: ${fmtD(ini)} a ${fmtD(fim)}`, custom:`${fmtD(ini)} a ${fmtD(fim)}`};
  const val = lista.reduce((s,e)=>s+e.preco,0), pgs = lista.filter(e=>e.pago).length;

  document.getElementById('pdf-subtitle').textContent = `Fornecedor: ${forn} · ${pLabels[periodoAtivo]}`;
  document.getElementById('pdf-date-info').innerHTML  = `Gerado em: ${new Date().toLocaleString('pt-BR')}<br>Total: ${lista.length} encomenda${lista.length!==1?'s':''}`;
  document.getElementById('ps-total').textContent = lista.length;
  document.getElementById('ps-pag').textContent   = pgs;
  document.getElementById('ps-pend').textContent  = lista.length-pgs;
  document.getElementById('ps-val').textContent   = val.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  document.getElementById('pdf-footer').textContent = `Encomendas · ${new Date().toLocaleString('pt-BR')} · ${lista.length} registro${lista.length!==1?'s':''}`;

  document.getElementById('lista-encomendas').innerHTML = buildCards(lista);
  fecharModal('modal-pdf');
  setTimeout(() => window.print(), 300);
  setTimeout(() => renderizar(), 1800);
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${tipo} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderizar();
</script>
</body>
</html>
