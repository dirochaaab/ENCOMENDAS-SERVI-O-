<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encomendas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23F97316'/><text y='72' x='50' text-anchor='middle' font-size='62'>📦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111; --surface: #1C1C1C; --card: #242424; --card-hover: #2A2A2A;
  --border: #333; --accent: #F97316; --accent-dim: rgba(249,115,22,0.15);
  --green: #22C55E; --green-dim: rgba(34,197,94,0.12);
  --red: #EF4444; --red-dim: rgba(239,68,68,0.12);
  --yellow: #EAB308; --blue: #3B82F6; --blue-dim: rgba(59,130,246,0.12);
  --purple: #A855F7; --purple-dim: rgba(168,85,247,0.12);
  --text: #E5E5E5; --text-muted: #888; --text-dim: #555;
  --radius: 10px; --radius-sm: 6px;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 14px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.header-stats { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); }
.header-stats span strong { color: var(--text); font-weight: 600; margin-left: 2px; }

/* TOOLBAR */
.toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; gap: 8px; align-items: center; position: sticky; top: 52px; z-index: 99; }
.btn-nova { background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; padding: 8px 14px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.search-wrap { position: relative; flex: 1; }
.search-wrap input { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 10px 7px 30px; outline: none; width: 100%; }
.search-wrap input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 12px; }
.btn-pdf-top { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 7px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.btn-pdf-top:hover { border-color: var(--accent); color: var(--accent); }

/* FILTER BAR - RODAPÉ */
.filterbar {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 0 14px; display: flex; gap: 0; overflow-x: auto;
  position: sticky; bottom: 0; z-index: 99;
}
.filter-btn {
  background: none; border: none; border-top: 2px solid transparent;
  color: var(--text-muted); font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 600; padding: 10px 14px;
  cursor: pointer; white-space: nowrap; flex: 1; text-align: center;
}
.filter-btn.ativo { color: var(--accent); border-top-color: var(--accent); }

/* MAIN */
.main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }

/* DATA GROUP */
.data-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.data-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
.data-line { flex: 1; height: 1px; background: var(--border); }
.data-count { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

/* CLIENTE GROUP */
.cliente-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
.cliente-header { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
.cliente-info { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cliente-avatar { width: 28px; height: 28px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
.cliente-nome { font-size: 13px; font-weight: 700; }
.cliente-tel { font-size: 11px; color: var(--text-muted); }
.btn-wpp { display: flex; align-items: center; gap: 4px; background: #128C7E22; border: 1px solid #128C7E55; border-radius: var(--radius-sm); color: #25D366; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; padding: 5px 8px; cursor: pointer; text-decoration: none; flex-shrink: 0; }
.btn-wpp svg { width: 12px; height: 12px; }

/* ENCOMENDA (grupo de itens do cliente no dia) */
.encomenda-wrap { border-bottom: 1px solid var(--border); }
.encomenda-wrap:last-child { border-bottom: none; }

/* STATUS BANNER */
.status-banner { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); gap: 8px; }
.status-esquerda { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.status-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.status-label.pendente { color: var(--yellow); }
.status-label.pago { color: var(--green); }
.status-label.finalizada { color: var(--purple); }
.status-hora { font-size: 10px; color: var(--text-dim); }
.status-actions { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }

/* BADGES DE STATUS */
.badge { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: none; font-family: 'Inter', sans-serif; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.badge:hover { opacity: 0.85; transform: scale(1.04); }
.badge.pendente { background: rgba(234,179,8,0.1); color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
.badge.pago     { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.badge.finalizada { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(168,85,247,0.4); font-size: 10px; padding: 4px 10px; }
.badge.inativo  { opacity: 0.3; cursor: default; transform: none !important; }

/* ITEM (peça) */
.item-card { padding: 10px 12px; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; border-bottom: 1px solid rgba(255,255,255,0.04); }
.item-card:last-child { border-bottom: none; }
.enc-num { font-size: 10px; font-weight: 700; color: var(--text-dim); padding-top: 2px; }
.enc-peca { font-size: 13px; font-weight: 600; line-height: 1.3; }
.enc-codigos { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
.enc-cod-tag { font-size: 10px; background: rgba(249,115,22,0.08); border: 1px solid rgba(249,115,22,0.2); border-radius: 4px; padding: 1px 6px; color: var(--accent); font-weight: 600; }
.enc-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.enc-fornecedor { font-size: 11px; color: var(--text-muted); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
.enc-preco { font-size: 13px; font-weight: 700; color: var(--accent); }
.enc-hora { font-size: 10px; color: var(--text-dim); }
.tag-tipo { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 7px; }
.tag-tipo.encomenda { background: rgba(59,130,246,0.1); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
.tag-tipo.estoque   { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.item-btns { display: flex; gap: 4px; }
.btn-icon { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 3px 5px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
.btn-icon:hover { color: var(--accent); background: var(--accent-dim); }
.btn-icon.del:hover { color: var(--red); background: var(--red-dim); }

/* TOTAL DA ENCOMENDA */
.enc-total { padding: 6px 12px; text-align: right; font-size: 11px; color: var(--text-muted); border-top: 1px dashed var(--border); }
.enc-total strong { color: var(--accent); font-size: 13px; }

/* EMPTY */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 36px; opacity: 0.3; }

/* DRAWER */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; display: none; }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 301; background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 0 16px 28px; max-height: 94vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); }
.drawer.open { transform: translateY(0); }
.drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 10px auto 14px; }
.drawer-title { font-size: 14px; font-weight: 800; margin-bottom: 14px; }

/* FORM */
.form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.form-group label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; outline: none; width: 100%; }
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group input::placeholder { color: var(--text-dim); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* LISTA DE ITENS NO DRAWER */
.itens-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.item-draft { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; align-items: flex-start; gap: 8px; }
.item-draft-body { flex: 1; }
.item-draft-peca { font-size: 13px; font-weight: 600; }
.item-draft-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.btn-rem-item { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px; flex-shrink: 0; }
.btn-rem-item:hover { color: var(--red); }

.secao-titulo { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.secao-titulo::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.btn-add-item { background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 10px; cursor: pointer; width: 100%; margin-bottom: 10px; transition: all 0.15s; }
.btn-add-item:hover { border-color: var(--accent); color: var(--accent); }

.toggle-pago { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; user-select: none; }
.toggle-pago input { display: none; }
.toggle-track { width: 36px; height: 20px; background: var(--border); border-radius: 999px; position: relative; transition: background 0.2s; flex-shrink: 0; }
.toggle-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: transform 0.2s; }
.toggle-pago.ativo .toggle-track { background: var(--green); }
.toggle-pago.ativo .toggle-track::after { transform: translateX(16px); }
.toggle-label { font-size: 14px; font-weight: 500; }

.btn-cadastrar { background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer; width: 100%; margin-top: 8px; transition: opacity 0.15s, transform 0.1s; }
.btn-cadastrar:hover { opacity: 0.9; }
.btn-cadastrar:active { transform: scale(0.98); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 400; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 14px; font-weight: 700; }
.modal-btns { display: flex; gap: 8px; margin-top: 4px; }
.btn-cancel { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 10px; cursor: pointer; }
.btn-ok { flex: 1; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; padding: 10px; cursor: pointer; }

.periodo-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.periodo-btn { flex: 1; min-width: 80px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; padding: 8px 4px; cursor: pointer; text-align: center; }
.periodo-btn.ativo { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.custom-dates { display: flex; gap: 8px; }
.custom-dates .form-group { flex: 1; }
.preview-info { font-size: 12px; color: var(--text-muted); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }

/* UPLOAD IMAGEM */
.upload-area { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 16px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; margin-bottom: 10px; }
.upload-area:hover { border-color: var(--accent); background: var(--accent-dim); }
.upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 22px; margin-bottom: 4px; }
.upload-txt { font-size: 12px; color: var(--text-muted); }
.upload-txt strong { color: var(--accent); }
.img-preview-wrap { position: relative; margin-bottom: 10px; }
.img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); display: block; }
.btn-rem-img { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); border: none; border-radius: 50%; color: white; font-size: 13px; width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
/* BOTÃO VER ORÇAMENTO */
.btn-orcamento { display: inline-flex; align-items: center; gap: 4px; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); border-radius: var(--radius-sm); color: var(--blue); font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; padding: 3px 8px; cursor: pointer; margin-top: 4px; }
.btn-orcamento:hover { background: rgba(59,130,246,0.2); }
/* MODAL IMAGEM */
.modal-img-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 16px; }
.modal-img-overlay.open { display: flex; }
.modal-img-overlay img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: var(--radius-sm); }
.btn-fechar-img { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 10px 24px; cursor: pointer; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 16px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 999; opacity: 0; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.verde { border-left: 3px solid var(--green); }
.toast.laranja { border-left: 3px solid var(--accent); }
.toast.vermelha { border-left: 3px solid var(--red); }
.toast.roxo { border-left: 3px solid var(--purple); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

/* ══ PRINT COMPACTO ══════════════════════════════════════════════════ */
@media print {
  @page { size: A4; margin: 10mm 10mm; }
  body { background: white !important; color: #111 !important; font-size: 9px !important; }
  header, .toolbar, .filterbar, .drawer, .drawer-overlay, .toast, .modal-overlay,
  .status-actions, .item-btns, .btn-wpp, .btn-orcamento { display: none !important; }
  .main { padding: 0 !important; overflow: visible !important; gap: 4px !important; }
  .pdf-header { display: flex !important; margin-bottom: 6px !important; padding-bottom: 6px !important; }
  .pdf-title { font-size: 13px !important; }
  .pdf-subtitle { font-size: 9px !important; }
  .pdf-summary { display: flex !important; padding: 5px 10px !important; margin-bottom: 6px !important; gap: 14px !important; }
  .pdf-summary-item strong { font-size: 11px !important; }
  .pdf-footer { display: block !important; margin-top: 6px !important; }
  .data-group { break-inside: avoid; margin-bottom: 4px !important; }
  .data-header { margin-bottom: 3px !important; }
  .data-label { font-size: 8px !important; }
  .cliente-group { border: 1px solid #ccc !important; background: white !important; break-inside: avoid; margin-bottom: 4px !important; }
  .cliente-header { padding: 4px 8px !important; background: #f0f0f0 !important; border-bottom: 1px solid #ddd !important; }
  .cliente-nome { font-size: 10px !important; color: #111 !important; }
  .cliente-tel { font-size: 8px !important; color: #555 !important; }
  .cliente-avatar { width: 20px !important; height: 20px !important; font-size: 8px !important; background: #eee !important; border-color: #bbb !important; color: #333 !important; }
  .status-banner { padding: 3px 8px !important; background: #fafafa !important; border-bottom: 1px solid #eee !important; }
  .status-label { font-size: 8px !important; }
  .status-hora { font-size: 8px !important; }
  .item-card { padding: 3px 8px !important; grid-template-columns: 14px 1fr auto !important; gap: 4px !important; border-bottom: 1px solid #f5f5f5 !important; }
  .enc-peca { font-size: 9px !important; color: #111 !important; }
  .enc-codigos { margin-top: 1px !important; gap: 3px !important; }
  .enc-cod-tag { font-size: 8px !important; padding: 0 4px !important; color: #ea580c !important; background: #fff7ed !important; border-color: #fed7aa !important; }
  .enc-meta { margin-top: 1px !important; gap: 4px !important; }
  .enc-fornecedor { font-size: 8px !important; padding: 0 4px !important; color: #444 !important; background: #f0f0f0 !important; border-color: #ccc !important; }
  .enc-preco { font-size: 9px !important; color: #ea580c !important; }
  .tag-tipo { font-size: 7px !important; padding: 0 4px !important; }
  .tag-tipo.encomenda { color: #1d4ed8 !important; background: #eff6ff !important; border-color: #bfdbfe !important; }
  .tag-tipo.estoque { color: #15803d !important; background: #f0fdf4 !important; border-color: #bbf7d0 !important; }
  .enc-total { padding: 2px 8px !important; font-size: 8px !important; border-top-color: #ddd !important; color: #555 !important; }
  .enc-num { font-size: 8px !important; color: #aaa !important; }
  .badge { font-size: 7px !important; padding: 1px 5px !important; }
  .badge.pago { background: #dcfce7 !important; color: #16a34a !important; border-color: #86efac !important; }
  .badge.pendente { background: #fef9c3 !important; color: #854d0e !important; border-color: #fde047 !important; }
  .badge.finalizada { background: #faf5ff !important; color: #7c3aed !important; border-color: #d8b4fe !important; }
}
.pdf-header { display: none; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #ea580c; }
.pdf-title { font-size: 17px; font-weight: 800; color: #111; }
.pdf-subtitle { font-size: 11px; color: #555; margin-top: 3px; }
.pdf-summary { display: none; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; gap: 20px; flex-wrap: wrap; }
.pdf-summary-item { display: flex; flex-direction: column; gap: 2px; }
.pdf-summary-item span:first-child { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
.pdf-summary-item strong { font-size: 13px; font-weight: 700; }
.pdf-footer { display: none; text-align: right; font-size: 10px; color: #888; margin-top: 16px; padding-top: 8px; border-top: 1px solid #ddd; }

/* CHECKLIST PDF */
.check-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; }
.check-item:last-child { border-bottom:none; }
.check-item:hover { background:rgba(255,255,255,0.04); }
.check-item input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; flex-shrink:0; cursor:pointer; }
.check-item-body { flex:1; min-width:0; }
.check-item-peca { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.check-item-meta { font-size:10px; color:var(--text-muted); }
.check-item-preco { font-size:12px; font-weight:700; color:var(--accent); flex-shrink:0; }
.check-sep { padding:4px 10px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--accent); background:rgba(249,115,22,0.06); border-bottom:1px solid var(--border); }

/* TABELA PDF IMPRESSÃO */
.pdf-tabela { width:100%; border-collapse:collapse; font-size:9px; }
.pdf-tabela th { background:#f0f0f0; font-size:8px; text-transform:uppercase; letter-spacing:0.5px; padding:3px 5px; border:1px solid #ccc; text-align:left; }
.pdf-tabela td { padding:3px 5px; border:1px solid #ddd; vertical-align:top; line-height:1.3; }
.pdf-tabela tr:nth-child(even) td { background:#fafafa; }
.pdf-tabela .td-cliente { font-weight:700; }
.pdf-tabela .td-status-pago { color:#15803d; font-weight:700; }
.pdf-tabela .td-status-pend { color:#854d0e; font-weight:700; }
</style>
</head>

  <div class="search-wrap">

  <div class="drawer-title">Nova Encomenda</div>

  </div>
  <div class="form-group">
    <label>Telefone</label>
    <input type="tel" id="inp-tel" placeholder="(00) 00000-0000" maxlength="16">
  </div>

  <div class="itens-lista" id="itens-lista"></div>

  <!-- FORM ADD ITEM -->
  <div id="form-item">

      <input type="text" id="inp-peca" placeholder="Descrição da peça">

      <div class="form-group"><label>Fornecedor</label><input type="text" id="inp-fornecedor" placeholder="Ex: Nakata"></div>

<!-- MODAL IMAGEM ORÇAMENTO -->

<!-- MODAL PDF -->

      <button class="btn-ok" style="background:#075E54" onclick="exportarWpp()">📱 WhatsApp</button>

</div>

<script>
// ── MIGRAÇÃO AUTOMÁTICA DE VERSÕES ANTIGAS ────────────────────────────────────
function migrarDados() {
  const chaveAtual = 'encomendas_v4';
  // Se já tem dados na chave atual, não faz nada
  if (localStorage.getItem(chaveAtual)) return;

  // Tenta puxar de versões anteriores em ordem decrescente
  const versoes = ['encomendas_v3', 'encomendas_v2', 'encomendas'];
  for (const chave of versoes) {
    const raw = localStorage.getItem(chave);
    if (!raw) continue;
    try {
      const dados = JSON.parse(raw);
      if (!Array.isArray(dados) || dados.length === 0) continue;

      // Normalizar estrutura antiga (v2/v3 tinham itens flat, não array de itens)
      const migrados = dados.map(enc => {
        // Se já tem array de itens (v4), mantém
        if (Array.isArray(enc.itens)) return { ...enc, imagem: enc.imagem || null };
        // Versão antiga: um único item flat → converte para array
        return {
          id:      enc.id || Date.now().toString(),
          cliente: enc.cliente || '',
          tel:     enc.tel || '',
          status:  enc.pago ? 'pago' : (enc.status || 'pendente'),
          imagem:  null,
          data:    enc.data || '',
          dataISO: enc.dataISO || '',
          hora:    enc.hora || '',
          itens: [{
            peca:       enc.peca || '',
            codPeca:    enc.codPeca || '',
            codForn:    enc.codForn || '',
            fornecedor: enc.fornecedor || '',
            preco:      enc.preco || 0,
            tipo:       'encomenda',
          }]
        };
      });

      localStorage.setItem(chaveAtual, JSON.stringify(migrados));
      console.log(`✅ Migrados ${migrados.length} registros de "${chave}" para "${chaveAtual}"`);
      return;
    } catch(e) {
      console.warn(`Erro ao migrar "${chave}":`, e);
    }
  }
}
migrarDados();

// ── DADOS ────────────────────────────────────────────────────────────────────
let encomendas = JSON.parse(localStorage.getItem('encomendas_v4') || '[]');
let filtroAtivo = 'pendente';
let periodoAtivo = 'hoje';
let itensDraft = [];
let imagemDraft = null; // base64 da imagem comprimida

// ── IMAGEM ────────────────────────────────────────────────────────────────────
function processarImagem(input) {
  const file = input.files[0];
  if (!file) return;
  processarBlob(file);
}

function processarBlob(blob) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 900;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      imagemDraft = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('img-preview').src = imagemDraft;
      document.getElementById('img-preview-wrap').style.display = 'block';
      document.getElementById('upload-area').style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(blob);
}

// Ctrl+V para colar imagem — funciona quando o drawer estiver aberto
document.addEventListener('paste', function(e) {
  const drawer = document.getElementById('drawer');
  if (!drawer.classList.contains('open')) return;
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      if (blob) {
        processarBlob(blob);
        toast('📋 Imagem colada!', 'verde');
      }
      break;
    }
  }
});

function removerImagem() {
  imagemDraft = null;
  document.getElementById('inp-imagem').value = '';
  document.getElementById('img-preview-wrap').style.display = 'none';
  document.getElementById('upload-area').style.display = 'block';
}

function verImagem(id) {
  const enc = encomendas.find(e => e.id === id);
  if (!enc || !enc.imagem) return;
  document.getElementById('modal-img-src').src = enc.imagem;
  document.getElementById('modal-img').classList.add('open');
}

function fecharImgModal() {
  document.getElementById('modal-img').classList.remove('open');
}

// ── DRAWER ───────────────────────────────────────────────────────────────────
function abrirDrawer() {
  itensDraft = [];
  imagemDraft = null;
  renderDraft();
  document.getElementById('img-preview-wrap').style.display = 'none';
  document.getElementById('upload-area').style.display = 'block';
  document.getElementById('inp-imagem').value = '';
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  setTimeout(() => document.getElementById('inp-cliente').focus(), 350);
}
function fecharDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// ── TOGGLE PAGO ──────────────────────────────────────────────────────────────
document.getElementById('toggle-pago').addEventListener('click', function(e) {
  e.preventDefault();
  const chk = document.getElementById('chk-pago');
  chk.checked = !chk.checked;
  this.classList.toggle('ativo', chk.checked);
  document.getElementById('toggle-label').textContent = chk.checked ? 'Pago' : 'Pendente';
});

// ── MÁSCARA TEL ───────────────────────────────────────────────────────────────
document.getElementById('inp-tel').addEventListener('input', function() {
  let v = this.value.replace(/\D/g,'').substring(0,11);
  if (v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else if (v.length > 0) v = `(${v}`;
  this.value = v;
});

// ── ITENS DRAFT ───────────────────────────────────────────────────────────────
function adicionarItem() {
  const peca = document.getElementById('inp-peca').value.trim();
  if (!peca) { toast('Preencha o nome da peça.', 'vermelha'); return; }
  itensDraft.push({
    peca,
    codPeca:    document.getElementById('inp-cod-peca').value.trim(),
    codForn:    document.getElementById('inp-cod-forn').value.trim(),
    fornecedor: document.getElementById('inp-fornecedor').value.trim(),
    preco:      parseFloat(document.getElementById('inp-preco').value) || 0,
    tipo:       document.getElementById('inp-tipo').value || 'encomenda',
  });
  ['inp-peca','inp-cod-peca','inp-cod-forn','inp-fornecedor','inp-preco'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('inp-tipo').value = 'encomenda';
  document.getElementById('inp-peca').focus();
  renderDraft();
  toast('Produto adicionado!', 'laranja');
}

function renderDraft() {
  const lista = document.getElementById('itens-lista');
  if (!itensDraft.length) { lista.innerHTML = ''; return; }
  lista.innerHTML = itensDraft.map((it, i) => {
    const tipoLabel = it.tipo === 'estoque' ? '📦 Estoque' : '🔖 Encomenda';
    return `<div class="item-draft">
      <div class="item-draft-body">
        <div class="item-draft-peca">${it.peca} <span style="font-size:10px;font-weight:600;color:${it.tipo==='estoque'?'var(--green)':'var(--blue)'}">${tipoLabel}</span></div>
        <div class="item-draft-meta">
          ${it.fornecedor ? it.fornecedor : ''}
          ${it.codPeca ? ` · Cód: ${it.codPeca}` : ''}
          ${it.preco > 0 ? ` · R$ ${it.preco.toLocaleString('pt-BR',{minimumFractionDigits:2})}` : ''}
        </div>
      </div>
      <button class="btn-rem-item" onclick="removerDraft(${i})">✕</button>
    </div>`;
  }).join('');
}

function removerDraft(i) {
  itensDraft.splice(i, 1);
  renderDraft();
}

// ── CADASTRAR ─────────────────────────────────────────────────────────────────
function cadastrar() {
  const cliente = document.getElementById('inp-cliente').value.trim();
  const tel     = document.getElementById('inp-tel').value.trim();
  const pago    = document.getElementById('chk-pago').checked;

  if (!cliente) { toast('Preencha o nome do cliente.', 'vermelha'); return; }

  const pecaAtual = document.getElementById('inp-peca').value.trim();
  if (pecaAtual) adicionarItem();

  if (!itensDraft.length) { toast('Adicione pelo menos um produto.', 'vermelha'); return; }

  const agora = new Date();
  encomendas.unshift({
    id: Date.now().toString(),
    cliente, tel,
    pago:       pago,        // independente
    finalizada: false,       // independente
    itens: [...itensDraft],
    imagem: imagemDraft,
    data:    agora.toLocaleDateString('pt-BR'),
    dataISO: agora.toISOString().slice(0,10),
    hora:    agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
  });

  salvar(); renderizar(); limparForm(); fecharDrawer();
  toast(`✅ Encomenda de ${cliente} cadastrada!`, 'verde');
}

function limparForm() {
  ['inp-cliente','inp-tel','inp-peca','inp-cod-peca','inp-cod-forn','inp-fornecedor','inp-preco']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('inp-tipo').value = 'encomenda';
  document.getElementById('chk-pago').checked = false;
  document.getElementById('toggle-pago').classList.remove('ativo');
  document.getElementById('toggle-label').textContent = 'Pendente';
  itensDraft = []; renderDraft();
  removerImagem();
}

function salvar() { localStorage.setItem('encomendas_v4', JSON.stringify(encomendas)); }

// ── FILTRO ────────────────────────────────────────────────────────────────────
function setFilter(f) {
  filtroAtivo = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('ativo', b.dataset.filter === f));
  renderizar();
}

// ── STATUS INDEPENDENTES ──────────────────────────────────────────────────────
function togglePago(id) {
  const enc = encomendas.find(e => e.id === id); if (!enc) return;
  // migração: se tinha status antigo, converte
  if (enc.status !== undefined && enc.pago === undefined) {
    enc.pago = enc.status === 'pago';
    enc.finalizada = enc.status === 'finalizada';
    delete enc.status;
  }
  enc.pago = !enc.pago;
  salvar(); renderizar();
  toast(enc.pago ? '✅ Marcado como pago!' : '↩️ Pagamento removido', enc.pago ? 'verde' : 'laranja');
}

function toggleFinalizar(id) {
  const enc = encomendas.find(e => e.id === id); if (!enc) return;
  if (enc.status !== undefined && enc.finalizada === undefined) {
    enc.pago = enc.status === 'pago';
    enc.finalizada = enc.status === 'finalizada';
    delete enc.status;
  }
  enc.finalizada = !enc.finalizada;
  salvar(); renderizar();
  toast(enc.finalizada ? '🏁 Encomenda finalizada!' : '↩️ Reaberta', enc.finalizada ? 'roxo' : 'laranja');
}

// helper: pega estado real da encomenda (suporta formato antigo)
function getEnc(enc) {
  if (enc.status !== undefined && enc.pago === undefined) {
    return {
      pago: enc.status === 'pago',
      finalizada: enc.status === 'finalizada'
    };
  }
  return { pago: !!enc.pago, finalizada: !!enc.finalizada };
}

// ── EXCLUIR ENCOMENDA ─────────────────────────────────────────────────────────
function excluirEncomenda(id) {
  if (!confirm('Excluir esta encomenda inteira?')) return;
  encomendas = encomendas.filter(e => e.id !== id);
  salvar(); renderizar();
  toast('🗑️ Encomenda excluída.', 'vermelha');
}

// ── EXCLUIR ITEM ──────────────────────────────────────────────────────────────
function excluirItem(encId, idx) {
  const enc = encomendas.find(e => e.id === encId); if (!enc) return;
  if (enc.itens.length === 1) { excluirEncomenda(encId); return; }
  enc.itens.splice(idx, 1);
  salvar(); renderizar();
  toast('🗑️ Produto removido.', 'vermelha');
}

// ── EDITAR ITEM ───────────────────────────────────────────────────────────────
function abrirEditar(encId, idx) {
  const enc = encomendas.find(e => e.id === encId); if (!enc) return;
  const it = enc.itens[idx];
  document.getElementById('edit-enc-id').value   = encId;
  document.getElementById('edit-item-idx').value = idx;
  document.getElementById('edit-peca').value      = it.peca;
  document.getElementById('edit-cod-peca').value  = it.codPeca || '';
  document.getElementById('edit-cod-forn').value  = it.codForn || '';
  document.getElementById('edit-fornecedor').value= it.fornecedor || '';
  document.getElementById('edit-preco').value     = it.preco;
  document.getElementById('edit-tipo').value      = it.tipo || 'encomenda';
  document.getElementById('modal-editar').classList.add('open');
}
function salvarEdicao() {
  const encId = document.getElementById('edit-enc-id').value;
  const idx   = parseInt(document.getElementById('edit-item-idx').value);
  const enc   = encomendas.find(e => e.id === encId); if (!enc) return;
  enc.itens[idx] = {
    peca:       document.getElementById('edit-peca').value.trim() || enc.itens[idx].peca,
    codPeca:    document.getElementById('edit-cod-peca').value.trim(),
    codForn:    document.getElementById('edit-cod-forn').value.trim(),
    fornecedor: document.getElementById('edit-fornecedor').value.trim(),
    preco:      parseFloat(document.getElementById('edit-preco').value) || 0,
    tipo:       document.getElementById('edit-tipo').value || 'encomenda',
  };
  salvar(); renderizar(); fecharModal('modal-editar');
  toast('✏️ Produto atualizado!', 'laranja');
}

function fecharModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m =>
  m.addEventListener('click', function(e) { if (e.target === this) fecharModal(this.id); })
);

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function wppLink(tel, nome) {
  const num = tel.replace(/\D/g,'');
  const msg = encodeURIComponent(`Olá ${nome}, tudo bem? 😊\n\nPassando para avisar que a sua encomenda já chegou! 📦✅\n\nGostaria que entregássemos para você, ou prefere retirar no balcão?\n\nAguardamos seu retorno!`);
  return `https://wa.me/55${num}?text=${msg}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const STATUS_ICON  = { pendente:'⏳', pago:'✓', finalizada:'🏁' };
const STATUS_LABEL = { pendente:'Pendente', pago:'Pago', finalizada:'Finalizada' };

function buildCards(lista) {
  if (!lista.length) return `<div class="empty"><div class="empty-icon">📦</div><p>Nenhuma encomenda encontrada.</p></div>`;

  const porData = {};
  lista.forEach(e => {
    const k = e.dataISO || '0000-00-00';
    if (!porData[k]) porData[k] = {};
    if (!porData[k][e.cliente]) porData[k][e.cliente] = [];
    porData[k][e.cliente].push(e);
  });

  let html = '';
  Object.keys(porData).sort((a,b)=>b.localeCompare(a)).forEach(dataISO => {
    const grupos = porData[dataISO];
    const totalEnc = Object.values(grupos).flat().length;
    const dFmt = dataISO !== '0000-00-00'
      ? (() => { const d = new Date(dataISO+'T12:00:00'); const s = d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); })()
      : 'Data não registrada';

    html += `<div class="data-group">
      <div class="data-header">
        <span class="data-label">${dFmt}</span>
        <span class="data-line"></span>
        <span class="data-count">${totalEnc} encomenda${totalEnc>1?'s':''}</span>
      </div>`;

    Object.entries(grupos).forEach(([nome, encs]) => {
      const tel = encs[0].tel;
      const ini = nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
      const temTel = tel && tel.replace(/\D/g,'').length >= 10;
      const totalCliente = encs.reduce((s,e)=>s+e.itens.reduce((ss,it)=>ss+it.preco,0),0);

      html += `<div class="cliente-group">
        <div class="cliente-header">
          <div class="cliente-info">
            <div class="cliente-avatar">${ini}</div>
            <div>
              <div class="cliente-nome">${nome}</div>
              <div class="cliente-tel">${tel||'Sem telefone'} · ${encs.length} encomenda${encs.length>1?'s':''} · R$ ${totalCliente.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
            </div>
          </div>
          ${temTel?`<a class="btn-wpp" href="${wppLink(tel,nome)}" target="_blank">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.855L.057 23.886c-.06.217.002.45.163.606.116.112.27.171.427.171.059 0 .119-.008.178-.025l6.248-1.638A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.897 0-3.688-.506-5.237-1.389l-.374-.22-3.875 1.016 1.005-3.762-.243-.386A9.936 9.936 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
            WhatsApp</a>`:''}
        </div>`;

      // Cada encomenda do cliente
      encs.forEach(enc => {
        const { pago, finalizada } = getEnc(enc);
        const totalEncomenda = enc.itens.reduce((s,it)=>s+it.preco,0);

        html += `<div class="encomenda-wrap">
          <div class="status-banner">
            <div class="status-esquerda">
              <span class="status-hora">${enc.hora||enc.data}</span>
              ${pago
                ? `<span class="badge pago inativo">✓ Pago</span>`
                : `<button class="badge pendente" onclick="togglePago('${enc.id}')">⏳ Pendente — marcar pago</button>`}
            </div>
            <div class="status-actions">
              ${pago && !finalizada
                ? `<button class="badge finalizada" onclick="toggleFinalizar('${enc.id}')">🏁 Finalizar</button>`
                : finalizada
                ? `<span class="badge finalizada inativo">🏁 Finalizada</span><button class="badge pendente" style="font-size:9px;padding:2px 6px" onclick="toggleFinalizar('${enc.id}')">↩ Reabrir</button>`
                : ''}
              ${pago ? `<button class="badge" style="background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.3);font-size:9px" onclick="togglePago('${enc.id}')" title="Remover pagamento">✕ Pago</button>` : ''}
              <button class="btn-icon del" onclick="excluirEncomenda('${enc.id}')" title="Excluir">🗑</button>
            </div>
          </div>
          ${enc.itens.map((it,idx) => {
            const cods = [it.codPeca?`Peça: ${it.codPeca}`:'', it.codForn?`Forn: ${it.codForn}`:''].filter(Boolean);
            const tipo = it.tipo || 'encomenda';
            const tipoLabel = tipo === 'estoque' ? '📦 Estoque' : '🔖 Encomenda';
            return `<div class="item-card">
              <div class="enc-num">#${idx+1}</div>
              <div>
                <div class="enc-peca">${it.peca}</div>
                ${cods.length?`<div class="enc-codigos">${cods.map(c=>`<span class="enc-cod-tag">${c}</span>`).join('')}</div>`:''}
                <div class="enc-meta">
                  <span class="tag-tipo ${tipo}">${tipoLabel}</span>
                  ${it.fornecedor?`<span class="enc-fornecedor">${it.fornecedor}</span>`:''}
                  ${it.preco>0?`<span class="enc-preco">R$ ${it.preco.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:''}
                </div>
              </div>
              <div class="item-btns">
                <button class="btn-icon" onclick="abrirEditar('${enc.id}',${idx})">✏️</button>
                <button class="btn-icon del" onclick="excluirItem('${enc.id}',${idx})">🗑</button>
              </div>
            </div>`;
          }).join('')}
          ${enc.itens.length>1?`<div class="enc-total">Total: <strong>R$ ${totalEncomenda.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong>${enc.imagem?` <button class="btn-orcamento" onclick="verImagem('${enc.id}')">📷 Ver orçamento</button>`:''}</div>`
          : enc.imagem ? `<div class="enc-total">${enc.imagem?`<button class="btn-orcamento" onclick="verImagem('${enc.id}')">📷 Ver orçamento</button>`:''}</div>` : ''}
        </div>`;
      });

      html += `</div>`; // fecha cliente-group
    });
    html += `</div>`; // fecha data-group
  });
  return html;
}

function renderizar() {
  const busca = document.getElementById('inp-busca').value.toLowerCase();
  const lista = encomendas.filter(e => {
    const { pago, finalizada } = getEnc(e);
    const visivel =
      filtroAtivo === 'pendente'   ? !finalizada :          // tudo em aberto
      filtroAtivo === 'pago'       ? (pago && !finalizada) : // pagos em aberto
      filtroAtivo === 'finalizada' ? finalizada :
      /* todos */                    !finalizada;
    const mb = !busca
      || e.cliente.toLowerCase().includes(busca)
      || e.itens.some(it =>
          it.peca.toLowerCase().includes(busca)
          || (it.fornecedor||'').toLowerCase().includes(busca)
          || (it.codPeca||'').toLowerCase().includes(busca)
          || (it.codForn||'').toLowerCase().includes(busca)
        );
    return visivel && mb;
  });

  const tot = encomendas.length;
  const pgs = encomendas.filter(e=>{ const r=getEnc(e); return r.pago && !r.finalizada; }).length;
  const pen = encomendas.filter(e=>{ const r=getEnc(e); return !r.pago && !r.finalizada; }).length;
  const fin = encomendas.filter(e=>getEnc(e).finalizada).length;
  const val = encomendas.reduce((s,e)=>s+e.itens.reduce((ss,it)=>ss+it.preco,0),0);
  document.getElementById('stat-total').textContent = tot;
  document.getElementById('stat-pag').textContent   = pgs;
  document.getElementById('stat-pend').textContent  = pen;
  document.getElementById('stat-fin').textContent   = fin;
  document.getElementById('stat-val').textContent   = val.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('lista-encomendas').innerHTML = buildCards(lista);
}

// ── PDF ───────────────────────────────────────────────────────────────────────
let fornSelecionados = new Set();
let itensSelecionados = new Set(); // "encId::itemIdx"

function abrirModalPDF() {
  fornSelecionados = new Set();
  setPeriodo('hoje');
  carregarCheckboxes();
  document.getElementById('modal-pdf').classList.add('open');
}

function carregarCheckboxes() {
  const lista = filtrarPDF();
  const box = document.getElementById('pdf-checklist');
  if (!lista.length) {
    box.innerHTML = '<div style="padding:12px;text-align:center;font-size:12px;color:var(--text-dim)">Nenhuma encomenda nesse filtro.</div>';
    itensSelecionados = new Set();
    atualizarPreview(); return;
  }

  // mantém selecionados que ainda existem
  const novoSet = new Set();
  lista.forEach(enc => enc.itens.forEach((_,i) => {
    const k = `${enc.id}::${i}`;
    if (itensSelecionados.size === 0 || itensSelecionados.has(k)) novoSet.add(k);
  }));
  itensSelecionados = novoSet;

  let html = '';
  lista.forEach(enc => {
    const { pago, finalizada } = getEnc(enc);
    const stLabel = finalizada ? '🏁' : pago ? '✅' : '⏳';
    html += `<div class="check-sep">${stLabel} ${enc.cliente} · ${enc.data}</div>`;
    enc.itens.forEach((it, i) => {
      const k = `${enc.id}::${i}`;
      const chk = itensSelecionados.has(k) ? 'checked' : '';
      html += `<label class="check-item">
        <input type="checkbox" ${chk} onchange="toggleItem('${k}',this.checked)">
        <div class="check-item-body">
          <div class="check-item-peca">${it.peca}</div>
          <div class="check-item-meta">${[it.fornecedor, it.codPeca?'Cód:'+it.codPeca:''].filter(Boolean).join(' · ')}</div>
        </div>
        ${it.preco>0?`<span class="check-item-preco">R$ ${it.preco.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:''}
      </label>`;
    });
  });
  box.innerHTML = html;
  atualizarPreview();
}

function toggleItem(k, checked) {
  if (checked) itensSelecionados.add(k);
  else itensSelecionados.delete(k);
  atualizarPreview();
}

function selecionarTodos(val) {
  document.querySelectorAll('#pdf-checklist input[type=checkbox]').forEach(cb => {
    cb.checked = val;
    const k = cb.closest('label')?.querySelector('input')?.getAttribute('onchange')?.match(/'([^']+)'/)?.[1];
  });
  // mais simples: recarregar com todos ou nenhum
  const lista = filtrarPDF();
  itensSelecionados = new Set();
  if (val) lista.forEach(enc => enc.itens.forEach((_,i) => itensSelecionados.add(`${enc.id}::${i}`)));
  carregarCheckboxes();
}

function setPeriodo(p) {
  periodoAtivo = p;
  document.querySelectorAll('.periodo-btn').forEach(b => b.classList.toggle('ativo', b.dataset.p===p));
  document.getElementById('custom-dates').style.display = p==='custom'?'flex':'none';
  if (p!=='custom') carregarCheckboxes();
}

function getIntervalo() {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const iso = d => d.toISOString().slice(0,10);
  if (periodoAtivo==='hoje') return {ini:iso(hoje),fim:iso(hoje)};
  if (periodoAtivo==='semana') {
    const dom=new Date(hoje); dom.setDate(hoje.getDate()-hoje.getDay());
    const sab=new Date(dom); sab.setDate(dom.getDate()+6);
    return {ini:iso(dom),fim:iso(sab)};
  }
  if (periodoAtivo==='mes') return {ini:iso(new Date(hoje.getFullYear(),hoje.getMonth(),1)),fim:iso(new Date(hoje.getFullYear(),hoje.getMonth()+1,0))};
  return {ini:document.getElementById('pdf-data-ini').value,fim:document.getElementById('pdf-data-fim').value};
}

function filtrarPDF() {
  const statusFiltro = document.getElementById('pdf-status').value;
  const {ini,fim} = getIntervalo();
  return encomendas.filter(e => {
    const d = e.dataISO||'';
    const { pago, finalizada } = getEnc(e);
    const dentroData = (!ini||d>=ini)&&(!fim||d<=fim);
    const matchStatus =
      statusFiltro==='' ? true :
      statusFiltro==='abertos' ? !finalizada :
      statusFiltro==='pendente' ? (!pago&&!finalizada) :
      statusFiltro==='pago' ? (pago&&!finalizada) :
      statusFiltro==='finalizada' ? finalizada : true;
    return dentroData && matchStatus;
  });
}

function atualizarPreview() {
  const total = itensSelecionados.size;
  const lista = filtrarPDF();
  let val = 0;
  lista.forEach(enc => enc.itens.forEach((it,i) => {
    if (itensSelecionados.has(`${enc.id}::${i}`)) val += it.preco;
  }));
  document.getElementById('pdf-preview-info').innerHTML =
    `<strong>${total}</strong> produto${total!==1?'s':''} selecionado${total!==1?'s':''} · Total: <strong>R$ ${val.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong>`;
}

function gerarPDF() {
  if (!itensSelecionados.size) { toast('Selecione pelo menos um produto.', 'vermelha'); return; }
  const lista = filtrarPDF();
  const {ini,fim} = getIntervalo();
  const fmtD = d => d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
  const pLabels = {hoje:`Hoje — ${fmtD(ini)}`,semana:`Semana: ${fmtD(ini)} a ${fmtD(fim)}`,mes:`Mês: ${fmtD(ini)} a ${fmtD(fim)}`,custom:`${fmtD(ini)} a ${fmtD(fim)}`};

  let val = 0, rows = '';
  lista.forEach(enc => {
    const { pago, finalizada } = getEnc(enc);
    const stLabel = finalizada ? '🏁 Finalizada' : pago ? '✅ Pago' : '⏳ Pendente';
    const stCls = pago ? 'td-status-pago' : 'td-status-pend';
    enc.itens.forEach((it,i) => {
      if (!itensSelecionados.has(`${enc.id}::${i}`)) return;
      val += it.preco;
      rows += `<tr>
        <td class="td-cliente">${enc.cliente}</td>
        <td>${it.peca}</td>
        <td>${it.fornecedor||'—'}</td>
        <td>${it.codPeca||'—'}</td>
        <td>${it.codForn||'—'}</td>
        <td>${it.preco>0?'R$ '+it.preco.toLocaleString('pt-BR',{minimumFractionDigits:2}):'—'}</td>
        <td class="${stCls}">${stLabel}</td>
        <td>${enc.data}</td>
      </tr>`;
    });
  });

  const tabelaHTML = `
    <table class="pdf-tabela">
      <thead><tr>
        <th>Cliente</th><th>Peça</th><th>Fornecedor</th>
        <th>Cód. Peça</th><th>Cód. Forn.</th>
        <th>Preço</th><th>Status</th><th>Data</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="text-align:right;font-size:9px;margin-top:4px;color:#555">
      Total selecionado: <strong>R$ ${val.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong>
    </div>`;

  document.getElementById('pdf-subtitle').textContent = pLabels[periodoAtivo];
  document.getElementById('pdf-date-info').innerHTML = `Gerado em: ${new Date().toLocaleString('pt-BR')}`;
  document.getElementById('ps-total').textContent = itensSelecionados.size;
  document.getElementById('ps-pag').textContent = lista.filter(e=>getEnc(e).pago).length;
  document.getElementById('ps-pend').textContent = lista.filter(e=>{ const r=getEnc(e); return !r.pago&&!r.finalizada; }).length;
  document.getElementById('ps-fin').textContent = lista.filter(e=>getEnc(e).finalizada).length;
  document.getElementById('ps-val').textContent = val.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  document.getElementById('pdf-footer').textContent = `Encomendas · ${new Date().toLocaleString('pt-BR')}`;
  document.getElementById('lista-encomendas').innerHTML = tabelaHTML;

  fecharModal('modal-pdf');
  setTimeout(()=>window.print(),300);
  setTimeout(()=>renderizar(),1800);
}

function exportarWpp() {
  if (!itensSelecionados.size) { toast('Selecione pelo menos um produto.', 'vermelha'); return; }
  const lista = filtrarPDF();
  const {ini,fim} = getIntervalo();
  const fmtD = d => d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
  const pLabels = {hoje:`Hoje (${fmtD(ini)})`,semana:`Semana (${fmtD(ini)} a ${fmtD(fim)})`,mes:`Mês (${fmtD(ini)} a ${fmtD(fim)})`,custom:`${fmtD(ini)} a ${fmtD(fim)}`};
  let val = 0;
  let txt = `📦 *RELATÓRIO DE ENCOMENDAS*\n📅 ${pLabels[periodoAtivo]}\n\n`;

  const porCliente = {};
  lista.forEach(enc => {
    enc.itens.forEach((it,i) => {
      if (!itensSelecionados.has(`${enc.id}::${i}`)) return;
      if (!porCliente[enc.cliente]) porCliente[enc.cliente] = { tel: enc.tel, itens: [] };
      porCliente[enc.cliente].itens.push({ ...it, enc });
      val += it.preco;
    });
  });

  Object.entries(porCliente).forEach(([nome, dados]) => {
    txt += `*${nome}*`;
    if (dados.tel) txt += ` · ${dados.tel}`;
    txt += `\n`;
    dados.itens.forEach((it,i) => {
      const { pago, finalizada } = getEnc(it.enc);
      const st = finalizada ? '🏁' : pago ? '✅' : '⏳';
      txt += `  ${i+1}. ${it.peca}`;
      if (it.fornecedor) txt += ` [${it.fornecedor}]`;
      if (it.preco>0) txt += ` — R$ ${it.preco.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
      txt += ` ${st}\n`;
    });
    txt += `\n`;
  });

  txt += `💰 *Total: R$ ${val.toLocaleString('pt-BR',{minimumFractionDigits:2})}*\n`;
  txt += `_${new Date().toLocaleString('pt-BR')}_`;

  fecharModal('modal-pdf');
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${tipo} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'),2800);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderizar();
</script>
